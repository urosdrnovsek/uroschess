name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System libraries for headless SDL
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libfreetype6

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Move-generation + engine tests
        run: pytest -q

      - name: Headless render smoke test
        run: python -m scripts.smoke

      - name: Validate bundled lessons
        run: python -m scripts.validate_content

      - name: Build and test installed wheel offline
        run: |
          python -m build --wheel
          python -m venv --system-site-packages /tmp/uroschess-wheel
          /tmp/uroschess-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/uroschess-wheel/bin/python "$GITHUB_WORKSPACE/scripts/check_installed.py"
