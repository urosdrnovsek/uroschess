[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uroschess"
version = "0.1.0"
description = "A pygame chess teaching app with annotated games and a from-scratch engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Uroš Drnovšek" }]
keywords = ["chess", "pygame", "education", "game", "board-game", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = ["pygame>=2.5"]

[project.urls]
Homepage = "https://github.com/urosdrnovsek/uroschess"
Source = "https://github.com/urosdrnovsek/uroschess"
Issues = "https://github.com/urosdrnovsek/uroschess/issues"

[project.scripts]
uroschess = "chess_game.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["chess_game*"]

[tool.setuptools.package-data]
"chess_game.content.starter" = ["*.json"]
"chess_game.content.starter.games" = ["*.pgn"]
"chess_game.content.starter.lessons" = ["*.json"]
"chess_game.assets.portraits" = ["*.bmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
